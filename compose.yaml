services:
  listener:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ${PLUNK_UPLOADS:-./uploads}:/uploads
      - listener-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build: .
    restart: unless-stopped
    environment:
      PLUNK_HOST: ${PLUNK_HOST:?Set PLUNK_HOST to your HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
volumes:
  listener-state:
  caddy-data:
  caddy-config:
